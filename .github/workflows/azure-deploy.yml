name: Build and deploy Node.js backend to Azure Web App - MusicAppWebApp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required for actions/checkout

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      # 👇 Change directory to backend
      - name: Install dependencies and build backend
        working-directory: ./backend
        run: |
          npm install
          npm run build --if-present
          npm test --if-present

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-backend
          path: ./backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write       # Required for requesting JWT
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: node-backend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A2D11D86DBD14A308193354C318FF7FF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_99B31353EC5641F183BCEFB2D6C7536A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3851C4A5EA82407FAA8DC0CA3F74D2E7 }}

      - name: Deploy backend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'MusicAppWebApp'
          slot-name: 'Production'
          package: .
